<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | IYYAANS CAFE</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f5eb;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      padding: 38px 30px;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(16, 59, 42, 0.10);
    }

    .logo {
      width: 65px;
      height: 65px;
      background: #174b35;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
      margin: 0 auto 18px;
    }

    h2 {
      text-align: center;
      color: #103b2a;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-top: 9px;
      margin-bottom: 30px;
      font-size: 14px;
    }

    label {
      display: block;
      color: #174b35;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dce5dd;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
      margin-bottom: 20px;
    }

    input:focus {
      border-color: #174b35;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      background: #174b35;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #103b2a;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      color: #c0392b;
      font-size: 13px;
      text-align: center;
      margin-top: 15px;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 28px;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">I</div>

    <h2>IYYAANS CAFE</h2>
    <p class="subtitle">Admin Login</p>

    <form id="loginForm">

      <label>Username</label>
      <input
        type="text"
        id="username"
        placeholder="Enter username"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit" class="login-btn" id="loginBtn">
        Login
      </button>

      <p id="message"></p>

    </form>

    <div class="footer">
      © 2026 IYYAANS CAFE POS
    </div>

  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";
      message.textContent = "";

      try {
        const response = await fetch(
          "http://localhost:5000/api/auth/login",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, password })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Login failed");
        }

        localStorage.setItem("adminToken", data.token);

        window.location.href = "index.html";

      } catch (error) {
        message.textContent = error.message;
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });
  </script>

</body>
</html>
